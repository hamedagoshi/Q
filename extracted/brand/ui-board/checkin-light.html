<!doctype html><html lang="fa" dir="rtl" data-theme="light"><head><meta charset="utf-8">
<style>
@font-face { font-family:'Vazirmatn'; src:url('file:///app/conversations/6a0730114ed513da2ad66c59/MONAD/brand/fonts/Vazirmatn-Regular.ttf'); font-weight:400; }
@font-face { font-family:'Vazirmatn'; src:url('file:///app/conversations/6a0730114ed513da2ad66c59/MONAD/brand/fonts/Vazirmatn-Medium.ttf'); font-weight:500; }
@font-face { font-family:'Vazirmatn'; src:url('file:///app/conversations/6a0730114ed513da2ad66c59/MONAD/brand/fonts/Vazirmatn-Bold.ttf'); font-weight:700; }
@font-face { font-family:'Inter'; src:url('file:///app/conversations/6a0730114ed513da2ad66c59/MONAD/brand/fonts/Inter.ttf'); font-weight:100 900; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
html,body{width:390px;height:844px;overflow:hidden}
body{
  background:#16171A; color:#EDE6D8;
  font-family:'Vazirmatn',system-ui,sans-serif; font-size:15px; line-height:1.6;
}
[data-theme="light"] body{background:#F5F2EB;color:#1B1A18}
.screen{height:100%;display:flex;flex-direction:column;padding:0 20px}
.num{font-family:'Inter';font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.card{background:#202123;border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:16px}
[data-theme="light"] .card{background:#FFFFFF;border-color:rgba(27,26,24,0.09)}
.muted{color:#9C9284}
[data-theme="light"] .muted{color:#6B6355}
.hair{height:1px;background:rgba(255,255,255,0.07);margin:0}
.row{display:flex;align-items:center;justify-content:space-between}
</style></head><body>
<div class="screen">
  <header style="display:flex;align-items:center;gap:12px;padding:26px 0 10px">
    <div style="font-size:20px;color:#6E6659">‹</div>
    <div style="font-size:13px;color:#6B6355">ژورنال</div>
    <div style="margin-right:auto" class="num">۱۵ آبان</div>
  </header>

  <div style="font-size:26px;font-weight:700;margin:10px 0 4px">ثبت صبح</div>
  <div class="muted" style="font-size:12px;margin-bottom:22px">۶۰ ثانیه — هرچه خواستی خالی بگذار</div>

  <div class="card" style="padding:18px">
    <div style="font-size:13px;margin-bottom:10px">چه چیزی ثبت می‌کنی؟</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px"><span style="padding:7px 13px;border-radius:999px;border:1px solid rgba(27,26,24,0.16);font-size:12px;color:#1B1A18">خواب</span><span style="padding:7px 13px;border-radius:999px;border:1px solid rgba(27,26,24,0.16);font-size:12px;color:#1B1A18">حال</span><span style="padding:7px 13px;border-radius:999px;border:1px solid rgba(27,26,24,0.16);font-size:12px;color:#1B1A18">رویداد</span><span style="padding:7px 13px;border-radius:999px;border:1px solid rgba(27,26,24,0.16);font-size:12px;color:#1B1A18">بازار</span><span style="padding:7px 13px;border-radius:999px;border:1px solid rgba(27,26,24,0.16);font-size:12px;color:#1B1A18">یادداشت</span></div>

    <div style="height:1px;background:rgba(255,255,255,0.07);margin:18px 0"></div>

    <div style="font-size:13px;margin-bottom:10px">حال</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px"><div style="padding:7px 13px;border-radius:999px;font-size:12px;
      border:1px solid rgba(255,255,255,0.07);color:#6B6355;
      background:rgba(200,131,42,0.14);color:#C8832A;border-color:transparent">آرام</div><div style="padding:7px 13px;border-radius:999px;font-size:12px;
      border:1px solid rgba(255,255,255,0.07);color:#6B6355;
      ">مضطرب</div><div style="padding:7px 13px;border-radius:999px;font-size:12px;
      border:1px solid rgba(255,255,255,0.07);color:#6B6355;
      ">خسته</div><div style="padding:7px 13px;border-radius:999px;font-size:12px;
      border:1px solid rgba(255,255,255,0.07);color:#6B6355;
      ">متمرکز</div><div style="padding:7px 13px;border-radius:999px;font-size:12px;
      border:1px solid rgba(255,255,255,0.07);color:#6B6355;
      ">بی‌تفاوت</div></div>
  </div>

  <div class="card" style="margin-top:12px;padding:16px">
    <div style="font-size:13px;margin-bottom:8px">یک خط برای خودت</div>
    <div style="min-height:64px;font-size:13.5px;color:#9A9080;line-height:1.9">
      خواب خوبی داشتم، بازار را با آرامش نگاه کردم…</div>
    <div class="hair" style="margin:10px 0 0"></div>
    <div class="row" style="margin-top:10px">
      <div style="font-size:11px;color:#6E6659">خواب</div>
      <div class="num" style="font-size:12px;color:#9C9284">۶ ساعت</div>
    </div>
  </div>

  <div style="margin-top:auto;padding:16px 0 24px;display:flex;gap:10px">
    <button style="flex:1;height:50px;border-radius:13px;border:1px solid rgba(255,255,255,0.12);
      background:transparent;color:#1B1A18;font-family:'Vazirmatn';font-size:14px">ذخیره‌ی پیش‌نویس</button>
    <button style="flex:1;height:50px;border-radius:13px;border:none;
      background:#A9661E;color:#16171A;font-family:'Vazirmatn';font-size:14px;font-weight:600">ثبت</button>
  </div>
</div></body></html>
