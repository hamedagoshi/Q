<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181A">
<title>MONAD</title>
<link rel="icon" href="/brand/final/assets/favicon.ico">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="stylesheet" href="/design-system/css/tokens.css">
<link rel="stylesheet" href="/design-system/css/base.css">
<link rel="stylesheet" href="/design-system/css/components.css">
<link rel="stylesheet" href="/app/css/app.css">
<script src="/design-system/js/theme.js" defer></script>
<script src="/design-system/js/ui.js" defer></script>
<script>
/* dev bootstrap: ?theme=…&lang=… sets initial theme/language before first paint */
(function(){try{var p=new URLSearchParams(location.search);
var th=p.get('theme'); if(th) localStorage.setItem('monad-theme',th);
var lg=p.get('lang'); if(lg){document.documentElement.setAttribute('lang',lg);
document.documentElement.setAttribute('dir',lg==='en'?'ltr':'rtl');}}catch(e){}})();
</script>
<script type="module" src="/app/js/app.js"></script>
</head>
<body></body>
</html>
